<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#02110c">
  <script>
    window.__MITCHIVIN_ZOOM_GUARD_MODE__ = 'strict';
  </script>
  <script src="js/mobileZoomGuard.js"></script>
  <!-- Instant first paint: solid #02110c (not color-scheme grey) + spinner + menu btn -->
  <style>
    html {
      background-color: #02110c !important;
      background: #02110c !important;
    }
    html, body {
      margin: 0;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #02110c !important;
      background:
        radial-gradient(ellipse 62% 70% at -8% 52%, rgba(34, 197, 94, 0.09), transparent 78%),
        radial-gradient(ellipse 64% 72% at 108% 48%, rgba(16, 185, 129, 0.08), transparent 80%),
        radial-gradient(circle at 18% 22%, rgba(110, 231, 183, 0.03), transparent 48%),
        radial-gradient(circle at 82% 26%, rgba(74, 222, 128, 0.025), transparent 50%),
        linear-gradient(180deg, #02110c 0%, #010806 48%, #000302 100%) !important;
    }
    body.app-loading #ipod-container {
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }
    #app-shell-loader {
      position: fixed !important;
      inset: 0 !important;
      z-index: 20000 !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      pointer-events: none !important;
      background: transparent !important;
    }
    body:not(.app-loading) #app-shell-loader { display: none !important; }
    .shell-boot-spinner {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid rgba(134, 239, 172, 0.16);
      border-top-color: rgba(134, 239, 172, 0.95);
      box-shadow: 0 0 22px rgba(74, 222, 128, 0.22);
      animation: shellBootSpin 0.85s linear infinite;
    }
    @keyframes shellBootSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    #shell-help {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 30001;
      width: 100%;
      height: 52px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      background: rgba(2, 17, 12, 0.42);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .shell-help-bar {
      display: flex;
      flex: 1;
      width: 100%;
      align-items: center;
      justify-content: space-between;
      padding: 0;
    }
    .shell-brand-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4em;
      height: 52px;
      margin: 0;
      padding: 0 0 0 16px;
      border: none;
      background: transparent;
      color: rgba(190, 230, 205, 0.72);
      font: 500 14px/1 'Source Sans 3', sans-serif;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
      cursor: default;
    }
    .shell-brand-name { color: rgba(220, 245, 228, 0.92); font-weight: 600; }
    .shell-brand-tag { color: rgba(160, 210, 180, 0.48); font-weight: 500; }
    .shell-help-actions { display: flex; align-items: center; height: 52px; }
    #shell-help-toggle {
      box-sizing: border-box;
      height: 52px;
      width: auto;
      margin: 0;
      padding: 0 16px 0 12px;
      border: none;
      border-radius: 0;
      background: transparent;
      color: rgba(255, 255, 255, 0.9);
      cursor: pointer;
      display: inline-flex !important;
      align-items: center;
      justify-content: flex-end;
      opacity: 0.48;
    }
    #shell-help-panel[hidden] { display: none !important; }
    @media (max-width: 600px) {
      #shell-help {
        height: calc(48px + env(safe-area-inset-top, 0px));
        padding-top: env(safe-area-inset-top, 0px);
      }
      .shell-brand-btn { height: 48px; font-size: 13px; padding-left: 10px; }
      .shell-help-actions { height: 48px; }
      #shell-help-toggle { height: 48px; padding: 0 10px 0 8px; }
    }
  </style>
  <title>MiPod</title>
  <meta name="description"
    content="Open-source DoodleDev click-wheel shell for MiPod. Live demo: https://builds.doodledev.app/#/mipod">
  <meta name="keywords"
    content="mipod, click wheel ui, doodledev shell, retro ui">
  <meta name="author" content="Mitch Ivin">
  <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1">
  <link rel="canonical" href="https://mitchivin.github.io/mipod/">
  <link rel="icon" type="image/png" href="public/fav.png">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="MiPod">
  <meta property="og:title" content="MiPod">
  <meta property="og:description"
    content="Open-source click-wheel shell designed in DoodleDev. Live demo: https://builds.doodledev.app/#/mipod">
  <meta property="og:url" content="https://mitchivin.github.io/mipod/">
  <meta property="og:image" content="https://mitchivin.github.io/mipod/public/social/interactive-ipod-og.jpg">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="MiPod">
  <meta name="twitter:description"
    content="Open-source shell only. Full demo on DoodleBuilds.">
  <meta name="twitter:image" content="https://mitchivin.github.io/mipod/public/social/interactive-ipod-og.jpg">

  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "MiPod",
      "applicationCategory": "DesignApplication",
      "operatingSystem": "Web",
      "url": "https://mitchivin.github.io/mipod/",
      "description": "Open-source DoodleDev shell for MiPod. Live demo: https://builds.doodledev.app/#/mipod",
      "author": {
        "@type": "Person",
        "name": "Mitch Ivin",
        "url": "https://mitchivin.com/"
      }
    }
  </script>
  <!-- Shell CSS assembled by npm run release (chrome + shell-demo LCD) -->
  <link rel="stylesheet" href="css/ipod-bundle.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <!-- Shell-help menu glyphs only; on-device Material Icons ship in the CSS bundle -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=block">
</head>

<body class="app-loading" style="background-color:#02110c;margin:0;">
  <div id="app-shell-loader" aria-live="polite" aria-label="Loading" style="position:fixed;inset:0;z-index:20000;display:flex;align-items:center;justify-content:center;pointer-events:none;">
    <div class="shell-boot-spinner" aria-hidden="true" style="width:28px;height:28px;border-radius:50%;border:2px solid rgba(134,239,172,0.16);border-top-color:rgba(134,239,172,0.95);box-shadow:0 0 22px rgba(74,222,128,0.22);animation:shellBootSpin 0.85s linear infinite;"></div>
  </div>

  <div id="shell-help" style="position:fixed;top:0;left:0;right:0;z-index:30001;">
    <div class="shell-help-bar">
      <div class="shell-brand" id="shell-brand">
        <button type="button" class="shell-brand-btn" id="shell-brand-btn" disabled tabindex="-1">
          <span class="shell-brand-name">MiPod</span>
          <span class="shell-brand-tag">Shell</span>
        </button>
      </div>
      <div class="shell-help-actions">
        <button type="button" id="shell-help-toggle" aria-label="Menu" aria-expanded="false" aria-controls="shell-help-panel">
          <span class="material-symbols-outlined shell-help-icon-menu" aria-hidden="true">menu</span>
        </button>
      </div>
    </div>
    <div id="shell-help-panel" role="menu" hidden>
      <div class="shell-help-subheader">Built with</div>
      <a class="shell-help-link" id="shell-help-doodledev" href="https://doodledev.app" target="_blank" rel="noopener noreferrer">
        <span class="material-symbols-outlined shell-help-icon" aria-hidden="true">open_in_new</span>
        <span class="shell-help-label">DoodleDev</span>
      </a>
      <div class="shell-help-subheader">Developed by Mitch Ivin</div>
      <a class="shell-help-link" id="shell-help-github" href="https://github.com/mitchivin" target="_blank" rel="noopener noreferrer">
        <svg class="shell-help-icon shell-help-icon--github" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
          <path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
        </svg>
        <span class="shell-help-label">Mitch's Github</span>
      </a>
      <a class="shell-help-link" id="shell-help-instagram" href="https://www.instagram.com/mitchivin/" target="_blank" rel="noopener noreferrer">
        <span class="material-symbols-outlined shell-help-icon" aria-hidden="true">photo_camera</span>
        <span class="shell-help-label">Mitch's Instagram</span>
      </a>
      <a class="shell-help-link" id="shell-help-linkedin" href="https://www.linkedin.com/in/mitchivin/" target="_blank" rel="noopener noreferrer">
        <span class="material-symbols-outlined shell-help-icon" aria-hidden="true">work</span>
        <span class="shell-help-label">Mitch's LinkedIn</span>
      </a>
      <a class="shell-help-link" id="shell-help-author" href="https://mitchivin.com/" target="_blank" rel="noopener noreferrer">
        <span class="material-symbols-outlined shell-help-icon" aria-hidden="true">person</span>
        <span class="shell-help-label">Mitch's Portfolio</span>
      </a>
    </div>
  </div>

  <!-- ── Device Shell ───────────────────────────────────────── -->
  <div id="ipod-container">
    <ipod-design id="ipod-component"></ipod-design>
  </div>

  <div id="shell-confirm" hidden>
    <div class="shell-confirm-backdrop" data-shell-confirm-dismiss></div>
    <div class="shell-confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="shell-confirm-title" aria-describedby="shell-confirm-message">
      <div class="shell-confirm-header">
        <div id="shell-confirm-title" class="shell-confirm-title">Open Link</div>
      </div>
      <div class="shell-confirm-content">
        <p id="shell-confirm-message" class="shell-confirm-message">Opens DoodleDev in a new tab. This device is available in the Preset menu.</p>
        <div class="shell-confirm-actions">
          <button type="button" class="shell-confirm-btn" data-shell-confirm-dismiss>Cancel</button>
          <button type="button" class="shell-confirm-btn shell-confirm-btn--primary" id="shell-confirm-open">Open</button>
        </div>
      </div>
    </div>
  </div>

    <script type="module" src="js/components/IpodDesign.js"></script>
  <script src="js/shellPress.js" defer></script>
</body>
</html>
